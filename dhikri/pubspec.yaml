name: dhikri
description: "تطبيق أذكار عربي يعمل بدون إنترنت — ذكري"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State / navigation
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.0

  # Local settings storage (no backend, no cloud)
  shared_preferences: ^2.5.5

  # Audio: on-device TTS + optional bundled asset narration
  flutter_tts: ^4.2.5
  just_audio: ^0.10.6
  audio_session: ^0.2.4

  # Local (device-only) reminders
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  # Open external apps (WhatsApp / SMS / phone). Never sends anything itself.
  url_launcher: ^6.3.2

  # App version shown in About / bug report template
  package_info_plus: ^10.2.1

  # إبقاء الشاشة مستيقظة أثناء الورد (إعداد اختياري، مُطفأ افتراضيًا)
  wakelock_plus: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # مؤقّتات وهمية لاختبار العدّ التنازلي في وضع "استمع وردّد" بلا انتظار حقيقي
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/fonts/OFL.txt
    - assets/data/

  # خط عربي مرخّص OFL ومُضمَّن محليًا — لا يوجد أي تنزيل خطوط وقت التشغيل.
  # الملف خط متغيّر (variable)، ونتحكم في الوزن عبر FontVariation في app_typography.dart
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#0A473B"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  min_sdk_android: 24

flutter_native_splash:
  color: "#0F5A4A"
  image: "assets/branding/splash_logo.png"
  android_12:
    color: "#0F5A4A"
    image: "assets/branding/splash_logo.png"
    icon_background_color: "#0F5A4A"
  android: true
  ios: true
  fullscreen: false
